<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Frame Mapper</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#222;
    color:white;
    padding:20px;
}

h2{
    text-align:center;
}

.app{
    display:flex;
    gap:20px;
    align-items:flex-start;
    justify-content:center;
    flex-wrap:wrap;
}

.controls{
    margin-bottom:20px;
}

input,button{
    padding:8px;
    margin:5px;
}

canvas{
    border:1px solid #555;
    background:white;
    display:block;
}

#magnifier{
    position:fixed;
    display:none;
    pointer-events:none;
    z-index:1000;
}

#magCanvas{
    border:2px solid #fff;
    border-radius:50%;
    background:#111;
    box-shadow:0 0 12px rgba(0,0,0,0.8);
}

#magInfo{
    display:flex;
    align-items:center;
    gap:6px;
    justify-content:center;
    margin-top:4px;
    padding:2px 6px;
    background:rgba(0,0,0,0.75);
    border-radius:4px;
    font-size:12px;
    font-family:monospace;
}

#magSwatch{
    width:12px;
    height:12px;
    border:1px solid #fff;
    display:inline-block;
}
</style>
</head>
<body>

<h2>Pixel Frame Mapper</h2>

<div class="app">

<div>
<div class="controls">

<input type="file" id="imageInput">

<label>
Boxes Across Image:
<input type="number" id="boxCount" value="10" min="5">
</label>

<label>
Border Lines:
<input type="number" id="borderLines" value="1" min="1">
</label>

<label>
Sampling Radius (px):
<input type="number" id="sampleRadius" value="3" min="0">
</label>

<label>
<input type="checkbox" id="magToggle" checked>
Magnifier
</label>

<label>
Zoom:
<input type="number" id="magZoom" value="8" min="2" max="40">
</label>

<button id="applyBtn">Apply</button>
<button id="resetBtn">Reset Drawing</button>
<button id="saveBtn">Download PNG</button>

</div>

<canvas id="canvas"></canvas>
</div>

</div>

<div id="magnifier">
<canvas id="magCanvas" width="180" height="180"></canvas>
<div id="magInfo">
<span id="magSwatch"></span>
<span id="magText">-</span>
</div>
</div>

<script>

const TARGET_WIDTH = 1000;
const BOX_FILL_RATIO = 0.85;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let state = null;

document
.getElementById("imageInput")
.addEventListener("change", loadImage);

document
.getElementById("applyBtn")
.addEventListener("click", applySettings);

document
.getElementById("resetBtn")
.addEventListener("click", resetProject);

document
.getElementById("saveBtn")
.addEventListener("click", saveCanvas);

function loadImage(e){

    const file = e.target.files[0];
    if(!file) return;

    const img = new Image();

    img.onload = ()=>buildProject(img);

    img.src = URL.createObjectURL(file);
}

function buildProject(sourceImage){

    const boxesAcross =
        parseInt(document.getElementById("boxCount").value, 10) || 40;

    const borderLines =
        parseInt(document.getElementById("borderLines").value, 10) || 2;

    const sampleRadius =
        parseInt(document.getElementById("sampleRadius").value, 10) || 0;

    // Integer box size keeps the image area an exact multiple of the grid.
    const boxSize =
        Math.max(1, Math.round(TARGET_WIDTH / boxesAcross));

    const imageWidth =
        boxSize * boxesAcross;

    const scale =
        imageWidth / sourceImage.width;

    const imageRows =
        Math.max(1, Math.round(sourceImage.height * scale / boxSize));

    const imageHeight =
        boxSize * imageRows;

    const totalCols =
        boxesAcross + borderLines * 2;

    const totalRows =
        imageRows + borderLines * 2;

    const canvasWidth =
        totalCols * boxSize;

    const canvasHeight =
        totalRows * boxSize;

    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    const imageCanvas =
        document.createElement("canvas");

    imageCanvas.width = imageWidth;
    imageCanvas.height = imageHeight;

    const imageCtx =
        imageCanvas.getContext("2d");

    imageCtx.drawImage(
        sourceImage,
        0,
        0,
        imageWidth,
        imageHeight
    );

    const imageData =
        imageCtx.getImageData(
            0,
            0,
            imageWidth,
            imageHeight
        );

    const imageX =
        borderLines * boxSize;

    const imageY =
        borderLines * boxSize;

    const boxes = [];

    for(let row=0; row<totalRows; row++){

        for(let col=0; col<totalCols; col++){

            const borderBox =
                row < borderLines ||
                row >= totalRows-borderLines ||
                col < borderLines ||
                col >= totalCols-borderLines;

            if(!borderBox) continue;

            boxes.push({

                row,
                col,

                cx:(col+0.5)*boxSize,
                cy:(row+0.5)*boxSize,

                filled:false,
                colour:"#FFFFFF"

            });
        }
    }

    state = {

        sourceImage,
        boxSize,
        borderLines,
        sampleRadius,

        imageWidth,
        imageHeight,

        imageX,
        imageY,

        imageCanvas,
        imageData,

        boxes,

        leaderLines:[]
    };

    render();
}

function render(){

    if(!state) return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="#ece8df";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    state.boxes.forEach(box=>{

        const size =
            state.boxSize * BOX_FILL_RATIO;

        const x =
            box.cx - size/2;

        const y =
            box.cy - size/2;

        ctx.fillStyle = box.colour;

        ctx.fillRect(
            x,
            y,
            size,
            size
        );

        ctx.strokeStyle="#999";

        ctx.strokeRect(
            x,
            y,
            size,
            size
        );
    });

    ctx.drawImage(
        state.imageCanvas,
        state.imageX,
        state.imageY
    );

    ctx.strokeStyle="rgba(255,255,255,0.85)";
    ctx.lineWidth=1;

    state.leaderLines.forEach(line=>{

        if(line.radius>0){

            ctx.beginPath();
            ctx.arc(
                line.x1,
                line.y1,
                line.radius,
                0,
                Math.PI*2
            );
            ctx.stroke();
        }
    });

    ctx.strokeStyle="white";
    ctx.lineWidth=2;

    state.leaderLines.forEach(line=>{

        ctx.beginPath();

        ctx.moveTo(
            line.x1,
            line.y1
        );

        ctx.lineTo(
            line.x2,
            line.y2
        );

        ctx.stroke();
    });
}

canvas.addEventListener(
"click",
function(event){

    if(!state) return;

    const rect =
        canvas.getBoundingClientRect();

    const x =
        (event.clientX - rect.left) *
        (canvas.width/rect.width);

    const y =
        (event.clientY - rect.top) *
        (canvas.height/rect.height);

    const insideImage =

        x >= state.imageX &&
        x <= state.imageX + state.imageWidth &&
        y >= state.imageY &&
        y <= state.imageY + state.imageHeight;

    if(!insideImage) return;

    state.sampleRadius =
        Math.max(
            0,
            parseInt(
                document.getElementById("sampleRadius").value,
                10
            ) || 0
        );

    const colour =
        sampleArea(
            x-state.imageX,
            y-state.imageY,
            state.sampleRadius
        );

    const box =
        nearestUnfilledBox(x,y);

    if(!box) return;

    box.filled=true;
    box.colour=colour;

    state.leaderLines.push({

        x1:x,
        y1:y,
        x2:box.cx,
        y2:box.cy,
        radius:state.sampleRadius

    });

    render();
});

const magnifier = document.getElementById("magnifier");
const magCanvas = document.getElementById("magCanvas");
const magCtx = magCanvas.getContext("2d");
const magSwatch = document.getElementById("magSwatch");
const magText = document.getElementById("magText");

canvas.addEventListener("mousemove", updateMagnifier);
canvas.addEventListener("mouseleave", hideMagnifier);

function canvasPos(event){

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:(event.clientX - rect.left) *
            (canvas.width/rect.width),

        y:(event.clientY - rect.top) *
            (canvas.height/rect.height)

    };
}

function hideMagnifier(){

    magnifier.style.display="none";
}

function updateMagnifier(event){

    if(!state ||
       !document.getElementById("magToggle").checked){

        hideMagnifier();
        return;
    }

    const pos = canvasPos(event);

    const insideImage =

        pos.x >= state.imageX &&
        pos.x <= state.imageX + state.imageWidth &&
        pos.y >= state.imageY &&
        pos.y <= state.imageY + state.imageHeight;

    if(!insideImage){

        hideMagnifier();
        return;
    }

    const zoom =
        Math.max(
            2,
            parseInt(
                document.getElementById("magZoom").value,
                10
            ) || 8
        );

    const radius =
        Math.max(
            0,
            parseInt(
                document.getElementById("sampleRadius").value,
                10
            ) || 0
        );

    // Same pixel the click handler will sample.
    const px =
        Math.round(pos.x - state.imageX);

    const py =
        Math.round(pos.y - state.imageY);

    const size = magCanvas.width;
    const srcSize = size/zoom;

    const sx = px + 0.5 - srcSize/2;
    const sy = py + 0.5 - srcSize/2;

    magCtx.fillStyle="#111";
    magCtx.fillRect(0,0,size,size);

    magCtx.imageSmoothingEnabled=false;

    magCtx.drawImage(
        state.imageCanvas,
        sx,
        sy,
        srcSize,
        srcSize,
        0,
        0,
        size,
        size
    );

    const centre = size/2;

    if(radius>0){

        magCtx.strokeStyle="rgba(255,255,255,0.9)";
        magCtx.lineWidth=1;

        magCtx.beginPath();
        magCtx.arc(
            centre,
            centre,
            radius*zoom,
            0,
            Math.PI*2
        );
        magCtx.stroke();
    }

    magCtx.strokeStyle="#ff0040";
    magCtx.lineWidth=1;

    magCtx.strokeRect(
        centre - zoom/2,
        centre - zoom/2,
        zoom,
        zoom
    );

    const colour =
        sampleArea(
            pos.x - state.imageX,
            pos.y - state.imageY,
            radius
        );

    magSwatch.style.background=colour;
    magText.textContent=`${px},${py} ${colour}`;

    magnifier.style.display="block";

    const offset = 24;

    const left =
        Math.min(
            event.clientX + offset,
            window.innerWidth - magnifier.offsetWidth - 8
        );

    const top =
        Math.min(
            event.clientY + offset,
            window.innerHeight - magnifier.offsetHeight - 8
        );

    magnifier.style.left = Math.max(8,left) + "px";
    magnifier.style.top = Math.max(8,top) + "px";
}

function nearestUnfilledBox(x,y){

    let best=null;
    let bestDist=Infinity;

    state.boxes.forEach(box=>{

        if(box.filled) return;

        const dx=box.cx-x;
        const dy=box.cy-y;

        const d=dx*dx+dy*dy;

        if(d<bestDist){

            bestDist=d;
            best=box;
        }

    });

    return best;
}


function sampleArea(ix,iy,radius){

    const x=Math.round(ix);
    const y=Math.round(iy);

    let r=0;
    let g=0;
    let b=0;
    let count=0;

    for(let dy=-radius; dy<=radius; dy++){

        for(let dx=-radius; dx<=radius; dx++){

            const px =
                Math.max(
                    0,
                    Math.min(
                        state.imageWidth-1,
                        x+dx
                    )
                );

            const py =
                Math.max(
                    0,
                    Math.min(
                        state.imageHeight-1,
                        y+dy
                    )
                );

            const index =
                (py*state.imageWidth+px)*4;

            r += state.imageData.data[index];
            g += state.imageData.data[index+1];
            b += state.imageData.data[index+2];

            count++;
        }
    }

    if(count===0) return "rgb(255,255,255)";

    r=Math.round(r/count);
    g=Math.round(g/count);
    b=Math.round(b/count);

    return `rgb(${r},${g},${b})`;
}

function applySettings(){

    if(!state || !state.sourceImage) return;

    buildProject(state.sourceImage);
}

function resetProject(){

    if(!state) return;

    state.boxes.forEach(box=>{

        box.filled=false;
        box.colour="#FFFFFF";

    });

    state.leaderLines=[];

    render();
}

function saveCanvas(){

    if(!state) return;

    const a=document.createElement("a");

    a.download="pixel-frame.png";
    a.href=canvas.toDataURL("image/png");

    a.click();
}

</script>

</body>
</html>
